<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Photo Gallery</title>
  <meta name="description" content="A fast, mobile-friendly photo gallery." />
  <meta name="theme-color" content="#ffffff" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="My Photo Gallery" />
  <meta property="og:description" content="A fast, mobile-friendly photo gallery." />
  <meta property="og:image" content="photo1.jpg" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="My Photo Gallery" />
  <meta name="twitter:description" content="A fast, mobile-friendly photo gallery." />
  <meta name="twitter:image" content="photo1.jpg" />

  <!-- Preload first image -->
  <link rel="preload" as="image" href="photo1.jpg" />

  <style>
    :root { --bg: #0b0b0b; --fg:#f5f5f5; --muted:#a1a1a1; --card:#121212; }
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; background:var(--bg); color:var(--fg); }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial; line-height:1.5; }
    header, footer, main { max-width:1100px; margin:0 auto; padding: 16px; }
    header h1 { margin:0; font-size: clamp(1.5rem, 3vw, 2.25rem); }
    header p { margin:.25rem 0 0; color:var(--muted); }

    .grid { display:grid; gap:12px; padding-block: 8px 28px; }
    @media (min-width:520px){ .grid { grid-template-columns: repeat(2, 1fr);} }
    @media (min-width:840px){ .grid { grid-template-columns: repeat(3, 1fr);} }

    figure { margin:0; border-radius:14px; overflow:hidden; background:var(--card); position:relative; }
    img { display:block; width:100%; height:auto; aspect-ratio: 4 / 3; }
    figcaption {
      position:absolute; inset-inline:0; bottom:0;
      padding:8px 12px; font-size:.9rem; color:#eaeaea;
      background: linear-gradient(transparent, rgba(0,0,0,.55));
    }

    footer { color:var(--muted); font-size:.9rem; }
    a { color:#8ab4ff; text-decoration:none; }
    a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <header>
    <h1>My Photo Gallery</h1>
    <p>A fast, mobile-friendly photo gallery.</p>
  </header>

  <main class="grid">
    <!-- Images -->
    <figure>
      <img src="photo1.jpg" alt="Photo 1 gallery image" loading="lazy" />
      <figcaption>Photo 1</figcaption>
    </figure>
    <figure>
      <img src="photo2.jpg" alt="Photo 2 gallery image" loading="lazy" />
      <figcaption>Photo 2</figcaption>
    </figure>
    <figure>
      <img src="photo3.jpg" alt="Photo 3 gallery image" loading="lazy" />
      <figcaption>Photo 3</figcaption>
    </figure>
    <figure>
      <img src="photo4.jpg" alt="Photo 4 gallery image" loading="lazy" />
      <figcaption>Photo 4</figcaption>
    </figure>
    <figure>
      <img src="photo5.jpg" alt="Photo 5 gallery image" loading="lazy" />
      <figcaption>Photo 5</figcaption>
    </figure>
    <figure>
      <img src="photo6.jpg" alt="Photo 6 gallery image" loading="lazy" />
      <figcaption>Photo 6</figcaption>
    </figure>
    <figure>
      <img src="photo7.jpg" alt="Photo 7 gallery image" loading="lazy" />
      <figcaption>Photo 7</figcaption>
    </figure>
    <figure>
      <img src="photo8.jpg" alt="Photo 8 gallery image" loading="lazy" />
      <figcaption>Photo 8</figcaption>
    </figure>
    <figure>
      <img src="photo9.jpg" alt="Photo 9 gallery image" loading="lazy" />
      <figcaption>Photo 9</figcaption>
    </figure>
    <figure>
      <img src="photo10.jpg" alt="Photo 10 gallery image" loading="lazy" />
      <figcaption>Photo 10</figcaption>
    </figure>
  </main>

  <footer>
    <span>© <span id="y"></span> • Built for fast load and good SEO.</span>
    <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
  </footer>
</body>
</html>
